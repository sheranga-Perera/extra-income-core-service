  - changeSet:
      id: core-011-fix-individual-profile-search-column-types
      author: phx
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                  IF EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = current_schema()
                        AND table_name = 'individual_profiles'
                        AND column_name = 'location'
                        AND data_type = 'bytea'
                  ) THEN
                      ALTER TABLE individual_profiles
                          ALTER COLUMN location TYPE VARCHAR(255)
                          USING encode(location, 'escape');
                  END IF;

                  IF EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = current_schema()
                        AND table_name = 'individual_profiles'
                        AND column_name = 'profession'
                        AND data_type = 'bytea'
                  ) THEN
                      ALTER TABLE individual_profiles
                          ALTER COLUMN profession TYPE VARCHAR(255)
                          USING encode(profession, 'escape');
                  END IF;

                  IF EXISTS (
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = current_schema()
                        AND table_name = 'individual_profiles'
                        AND column_name = 'skills'
                        AND data_type = 'bytea'
                  ) THEN
                      ALTER TABLE individual_profiles
                          ALTER COLUMN skills TYPE VARCHAR(1000)
                          USING encode(skills, 'escape');
                  END IF;
              END $$;

